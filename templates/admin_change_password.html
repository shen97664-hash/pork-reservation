{% extends "base.html" %}
{% block title %}修改密码 - 鲜猪肉直供{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-dark text-white text-center">
                <h4 class="mb-0"><i class="bi bi-key"></i> 修改密码</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">原密码</label>
                        <input type="password" name="old_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">新密码</label>
                        <input type="password" name="new_password" class="form-control" minlength="4" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">确认新密码</label>
                        <input type="password" name="confirm_password" class="form-control" minlength="4" required>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-dark btn-lg">确认修改</button>
                        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">返回</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
